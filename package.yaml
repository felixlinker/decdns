name:                decdns
version:             0.1.0.0
github:              "felixlinker/decdns"
license:             MIT
author:              "Felix Linker"
maintainer:          "linkerfelix@gmail.com"
copyright:           "2026 Felix Linker, ETH Zurich"

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

description:         Please see the README on GitHub at <https://github.com/felixlinker/decdns#readme>

extra-source-files:
- root-addresses
- root-keys
- examples/cname/**/*
- examples/dname/**/*
- examples/dnssec/**/*
- examples/ns/**/*
- examples/misconfigs/**/*
- examples/wellformedness/**/*
- examples/wildcards/**/*

dependencies:
- base >= 4.7 && < 5
- containers
- transformers
- parsec
- lens
- bytestring
- base64-bytestring
- base32
- iproute
- dns
- crypton
- memory
- time

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  dependencies:
  - text
  - crypton-x509

executables:
  decdns:
    main:                CLI.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -main-is CLI
    dependencies:
    - decdns
    - optparse-applicative

tests:
  decdns-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - decdns
    - tasty
    - tasty-hunit
    - tasty-quickcheck
    - QuickCheck
    - HUnit
    - directory
    - filepath
