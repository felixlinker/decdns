name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: haskell
        with:
          enable-stack: true

      - name: Cache compiled Stack dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.haskell.outputs.stack-root }}/snapshots
          key: stack-snapshots-${{ runner.os }}-${{ runner.arch }}-${{ steps.haskell.outputs.stack-version }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml', 'decdns.cabal') }}

      - name: Run tests (excluding live DNS queries)
        run: stack test --test-arguments='--pattern "!/Resolvable.Querying/"'
